<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>LinkHarbor — Your link is on the way</title>

<style>

:root{
  --indigo:#4338ca;
  --indigo-deep:#3730a3;
  --sky:#38bdf8;
  --fuchsia:#d946ef;
  --bg:#f3f5fb;
  --card:#ffffff;
  --line:#e6e9f2;
  --ink:#1f2430;
  --muted:#6b7180;
  --muted-soft:#9aa0ae;
  --gold:#e2a53a;
  --font:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}

*{ box-sizing:border-box; }
html, body{ margin:0; padding:0; }

body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

a{ color:inherit; }

@media(prefers-reduced-motion:reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* PROGRESS */
.progress-wrap{ display:flex; justify-content:center; padding:22px 18px 4px; }
.progress{ display:flex; align-items:center; gap:6px; }
.progress .seg{
  width:30px; height:4px; background:var(--line); border-radius:3px;
  position:relative; overflow:hidden;
}
.progress .seg.done{ background:var(--indigo); }
.progress .seg.current::after{
  content:""; position:absolute; inset:0; background:var(--fuchsia);
  width:var(--fill,0%); transition:width .2s linear;
}
.progress .step-num{ font-size:11px; font-weight:700; color:var(--muted-soft); margin-left:8px; }

/* SHARE */
.share-bar{ display:flex; justify-content:center; padding:2px 18px 0; }
.share-btn{
  font-family:var(--font); font-size:12.5px; font-weight:800;
  background:#fff; border:1px solid var(--indigo); color:var(--indigo);
  padding:9px 18px; border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:background .2s, color .2s;
}
.share-btn:hover{ background:var(--indigo); color:#fff; }
.share-btn.copied{ background:#1a8a4c; border-color:#1a8a4c; color:#fff; }

/* MAIN */
main{ flex-grow:1; display:flex; justify-content:center; padding:20px 18px 40px; }
.col{ width:100%; max-width:1000px; display:flex; flex-direction:column; gap:18px; }

.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:30px 28px;
  box-shadow:0 1px 2px rgba(30,35,60,.04), 0 8px 24px rgba(30,35,60,.05);
}

.eyebrow{
  font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--fuchsia); margin-bottom:8px;
}
h1{ font-size:clamp(22px,3.6vw,28px); font-weight:800; margin:0 0 8px; }
.sub{ color:var(--muted); font-size:14.5px; line-height:1.6; margin:0 0 26px; max-width:50ch; }

/* ADS — 300x250 banner slots */
.banners{ width:100%; margin-bottom:26px; }
.ad-row{
  width:100%; display:flex; justify-content:center; align-items:flex-start;
  gap:12px; flex-wrap:wrap;
}
.ad-box{
  width:300px; min-width:300px; height:250px; min-height:250px;
  display:flex; justify-content:center; align-items:center; overflow:hidden;
  background:#fafbfe; border:1px dashed #d9ddea; border-radius:10px;
}
.ad-box iframe{ max-width:100%; border:0; }

.ad-slot{ display:flex; flex-direction:column; align-items:center; gap:8px; }
.ad-hint{
  font-size:11.5px; font-weight:800; color:var(--indigo);
  background:rgba(67,56,202,0.08); border-radius:999px;
  padding:6px 12px; white-space:nowrap;
}
.ad-box-small{
  width:320px; min-width:320px; height:50px; min-height:50px;
  display:flex; justify-content:center; align-items:center; overflow:hidden;
  background:#fafbfe; border:1px dashed #d9ddea; border-radius:8px;
  margin:0 auto;
}

/* TIMER */
.gate-action{
  padding-top:22px; border-top:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.timer-wrap{ display:flex; align-items:center; gap:12px; }
.ring{ width:42px; height:42px; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:3.5; }
.ring .bg{ stroke:var(--line); }
.ring .fg{
  stroke:var(--fuchsia); stroke-linecap:round; stroke-dasharray:113; stroke-dashoffset:113;
  transition:stroke-dashoffset 1s linear;
}
.timer-text{ font-size:12px; color:var(--muted); line-height:1.4; }
.timer-text b{ display:block; font-size:15px; color:var(--ink); }

button.next, .cta-btn{
  font-family:var(--font); font-size:13.5px; font-weight:800;
  background:linear-gradient(100deg, var(--indigo), var(--fuchsia));
  color:#fff; border:none; padding:13px 26px; border-radius:999px;
  cursor:not-allowed; opacity:.35; transition:opacity .25s, transform .15s;
}
button.next.ready, .cta-btn.ready{ cursor:pointer; opacity:1; }
button.next.ready:hover, .cta-btn.ready:hover{ transform:translateY(-1px); }

/* ARTICLE */
.divider-label{
  font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted-soft); margin-bottom:14px;
}
.article h3{ font-size:19px; font-weight:800; margin:0 0 6px; }
.article .byline{ font-size:12px; color:var(--muted-soft); font-weight:600; margin-bottom:12px; }
.article p{ font-size:13.5px; line-height:1.75; color:var(--muted); margin:0; }

/* FINAL PAGE */
.final-card{ text-align:center; padding:36px 30px; }
.final-card h1{ font-size:24px; }
.final-card .sub{ margin-left:auto; margin-right:auto; }

.get-link-btn{
  font-family:var(--font); font-size:14px; font-weight:800;
  background:linear-gradient(100deg, var(--indigo), var(--fuchsia));
  color:#fff; border:none; padding:15px 40px; border-radius:999px;
  cursor:not-allowed; opacity:.35; margin:6px 0 4px; transition:opacity .25s, transform .15s;
}
.get-link-btn.ready{ cursor:pointer; opacity:1; }
.get-link-btn.ready:hover{ transform:translateY(-1px); }

/* SPONSOR */
.sponsor-block{ text-align:center; padding:20px 0 0; }
.sponsor-block .lbl{ font-size:12px; font-weight:800; letter-spacing:.04em; color:var(--muted); margin-bottom:12px; }
.sponsor-pill{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line);
  border-radius:999px; padding:9px 18px; font-weight:700; font-size:14px; color:var(--ink); background:#fff;
}
.sponsor-pill .dot{ width:20px; height:20px; border-radius:50%; background:var(--gold); display:inline-block; }

.become-sponsor{
  display:block; text-align:center; background:linear-gradient(100deg, var(--sky), var(--indigo));
  color:#fff; font-weight:800; font-size:14px; padding:16px; border-radius:12px; text-decoration:none;
}

/* FINAL LINK */
.final-link-box{
  margin-top:22px; border:1px solid #c9f0d8; background:#f2fbf6; border-radius:12px;
  padding:18px 20px; text-align:left;
}
.final-link-box .tag2{
  font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:#1a8a4c; margin-bottom:8px; display:block;
}
.link-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.link-field{
  flex-grow:1; font-family:"SFMono-Regular", Menlo, Consolas, monospace; font-size:13px;
  color:var(--ink); background:#fff; border:1px solid var(--line); padding:11px 13px;
  border-radius:8px; word-break:break-all; min-width:180px;
}
.copy-btn{
  font-family:var(--font); font-size:12px; font-weight:700; background:#fff;
  border:1px solid var(--indigo); color:var(--indigo); padding:10px 14px; border-radius:8px; cursor:pointer;
}
.copy-btn:hover{ background:var(--indigo); color:#fff; }
.go-link{
  display:inline-block; margin-top:12px; font-weight:800; font-size:13.5px; color:#fff;
  background:#1a8a4c; padding:11px 22px; border-radius:999px; text-decoration:none;
}

/* MOBILE */
@media(max-width:950px){
  .col{ max-width:660px; }
}
@media(max-width:480px){
  .card{ padding:22px 18px; }
  .gate-action{ justify-content:center; text-align:center; }
  .ad-box{ width:300px; min-width:300px; max-width:100%; }
}

</style>
</head>


<body>

<div class="progress-wrap">
  <div class="progress" id="progress"></div>
</div>

<div class="share-bar">
  <button class="share-btn" id="shareBtn">🔗 Share with a friend</button>
</div>

<main>
  <div class="col" id="col"></div>
</main>


<script>
(function(){

/* =========================================
   SETTINGS
========================================= */

/*
  Multiple destination links, selected by a ?id= URL parameter.
  Example: yourpage.html?id=shadowfight → shows the Shadow Fight link
           yourpage.html?id=aftermotionz    → shows the Other App link
  Add as many entries as you want — the key on the left is what
  goes in the URL after ?id=
*/
const LINKS = {
  shadowfight: { name: "Shadow Fight", url: "your on worng page maybe" },
  aftermotinz: { name: "After motion z",    url: "https://www.mediafire.com/file/6jebd6yyh2r5kqa/AMZP_ORI_10AUG_FIXED2.apk/file" }
};

// Used when no ?id= is given, or an unknown id is given
const DEFAULT_LINK_ID = "shadowfight";

// Used when no ?id= is given, or an unknown id is given
const DEFAULT_LINK_ID = "aftermotionz";

// Your Telegram contact — shown on the "Become a Sponsor" button
const TELEGRAM_CONTACT = "https://t.me/@I7XKAVI";

// TOTAL WAITING PAGES
const TOTAL_PAGES = 6;

// WAIT TIME
const WAIT_SECONDS = 30;

/*
  300x250 banner ad — highperformanceformat.com (atOptions format).
  Each ad box gets its own key below. Right now all three slots on
  every page use the same key you gave me. If you have separate
  zone keys for slot 1 / 2 / 3, just swap them into this array —
  the code below already loops through it per slot.
*/
const BANNER_KEYS = [
  "9cdff28b0ec7fcdc1fe4edd36bd3054b", // ad1
  "9cdff28b0ec7fcdc1fe4edd36bd3054b", // ad2
  "9cdff28b0ec7fcdc1fe4edd36bd3054b"  // ad3
];

// Script-tag ad — loaded once on every page (steps 1–6)
const SITEWIDE_AD_SRC = "https://pl30832087.effectivecpmnetwork.com/42/63/d3/4263d332b865afacfb5d6b51c56a47cd.js";

// Script-tag ad — loaded ONLY on step 5, in addition to the sitewide one above
const PAGE5_AD_SRC = "https://pl30831904.effectivecpmnetwork.com/3f/18/1f/3f181fbc97af489eb8d633435f071dea.js";

// Single 320x50 banner used on the final page (step 6) instead of the 3-box 300x250 grid
const FINAL_BANNER_KEY = "eee5199c1ecc4b17f86952845c3e0047";
const FINAL_BANNER_W = 320;
const FINAL_BANNER_H = 50;

/* =========================================
   ARTICLES
========================================= */

const articles = [
  { title:"Why waiting rooms became the internet's last honest interface", byline:"Field Notes · 4 min read",
    body:"Somewhere between the pop-up and the paywall, a quieter pattern took hold: the gate. Not a lock exactly — more a turnstile, asking for a moment of attention before letting you through. The gate makes that trade explicit instead of hiding it." },
  { title:"The thirty-second unit", byline:"Notes on Attention · 3 min read",
    body:"Thirty seconds is short enough to not feel like a toll, and long enough for a glance to become a read. It's roughly the time it takes a kettle to start singing — long enough to matter, short enough to not mind." },
  { title:"A short history of the link locker", byline:"Archive · 5 min read",
    body:"Long before shortened URLs were common, forum users traded direct download links behind simple gates — partly to fund server costs, partly to slow down bots. The format barely changed in twenty years: a countdown, a banner, a reveal." },
  { title:"On the etiquette of the almost-there page", byline:"Field Notes · 3 min read",
    body:"The best gate pages share one habit: they tell you exactly what's coming and how long it takes. A visible timer, a visible step count, and a visible end point are the whole trick — everything else is decoration." },
  { title:"What actually happens in the last thirty seconds", byline:"Notes on Attention · 4 min read",
    body:"This is the step where the countdown stops being a formality and starts being an ending. Once it runs out, the flow moves to the final unlock page — no further ad steps after this one." }
];

/* =========================================
   STATE
========================================= */

const urlParams = new URLSearchParams(window.location.search);
const requestedPage = parseInt(urlParams.get("step") || "1", 10);

const linkId = urlParams.get("id") || DEFAULT_LINK_ID;
const currentLink = LINKS[linkId] || LINKS[DEFAULT_LINK_ID];
const OFFICIAL_LINK = currentLink.url;
const OFFICIAL_LINK_NAME = currentLink.name;

let page = Number.isFinite(requestedPage)
  ? Math.min(Math.max(requestedPage, 1), TOTAL_PAGES)
  : 1;

let secondsLeft = WAIT_SECONDS;
let timerId = null;
let linkRevealed = false;

const col = document.getElementById("col");
const progress = document.getElementById("progress");

/* =========================================
   PROGRESS BAR
========================================= */

function renderProgress(){
  progress.innerHTML = "";
  for(let i = 1; i <= TOTAL_PAGES; i++){
    const seg = document.createElement("div");
    seg.className = "seg" + (i < page ? " done" : (i === page ? " current" : ""));
    if(i === page){
      seg.style.setProperty("--fill", "0%");
      seg.id = "segCurrent";
    }
    progress.appendChild(seg);
  }
  const num = document.createElement("div");
  num.className = "step-num";
  num.textContent = "STEP " + page + " / " + TOTAL_PAGES;
  progress.appendChild(num);
}

/* =========================================
   LOAD ONE 300x250 BANNER (atOptions format)
========================================= */

function loadBanner(containerId, key, width, height){
  const container = document.getElementById(containerId);
  if(!container) return;

  width = width || 300;
  height = height || 250;

  container.innerHTML = "";

  // The invoke.js from this ad network renders itself via document.write.
  // document.write only behaves reliably during a document's own initial
  // parse — calling it three times into the SAME page (our earlier
  // approach) meant only the first call actually rendered and the other
  // two silently did nothing. Giving each slot its own blank iframe gives
  // each banner its own document to write into, so all render correctly.
  const iframe = document.createElement("iframe");
  iframe.style.width = width + "px";
  iframe.style.height = height + "px";
  iframe.style.border = "0";
  iframe.setAttribute("scrolling", "no");
  container.appendChild(iframe);

  const doc = iframe.contentWindow.document;
  doc.open();
  doc.write(
    "<!DOCTYPE html><html><head><style>*{margin:0;padding:0;}</style></head><body>" +
    "<script>atOptions = {" +
    "'key' : '" + key + "'," +
    "'format' : 'iframe'," +
    "'height' : " + height + "," +
    "'width' : " + width + "," +
    "'params' : {}" +
    "};</" + "script>" +
    "<script src=\"https://www.highperformanceformat.com/" + key + "/invoke.js\"></" + "script>" +
    "</body></html>"
  );
  doc.close();
}

function loadAds(){
  loadBanner("ad1", BANNER_KEYS[0], 300, 250);
  loadBanner("ad2", BANNER_KEYS[1], 300, 250);
  loadBanner("ad3", BANNER_KEYS[2], 300, 250);
}

function loadFinalBanner(){
  loadBanner("finalAd", FINAL_BANNER_KEY, FINAL_BANNER_W, FINAL_BANNER_H);
}

// Plain <script src="..."> ads that render themselves globally
// (social bar / popunder style) rather than into a specific container.
function loadExternalScript(src){
  const s = document.createElement("script");
  s.src = src;
  s.async = true;
  document.body.appendChild(s);
}

function loadPageWideAds(){
  loadExternalScript(SITEWIDE_AD_SRC);
  if(page === 5){
    loadExternalScript(PAGE5_AD_SRC);
  }
}

function getAdsHTML(){
  return `
    <div class="banners">
      <div class="ad-row">
        <div class="ad-slot">
          <div class="ad-hint">Wait 30s,then click on ad then scroll down ↓</div>
          <div class="ad-box" id="ad1"></div>
        </div>
        <div class="ad-box" id="ad2"></div>
        <div class="ad-box" id="ad3"></div>
      </div>
    </div>
  `;
}

/* =========================================
   STANDARD PAGE
========================================= */

function renderStandardPage(){
  const article = articles[page - 1];

  col.innerHTML = `
    <div class="card">
      <div class="eyebrow">Step ${page} of ${TOTAL_PAGES}</div>
      <h1>Getting your link ready</h1>
      <p class="sub">A short wait keeps this page free to run. Your link continues on the next step.</p>

      ${getAdsHTML()}

      <div class="gate-action">
        <div class="timer-wrap">
          <svg class="ring" viewBox="0 0 42 42">
            <circle class="bg" cx="21" cy="21" r="18"></circle>
            <circle class="fg" id="ringFg" cx="21" cy="21" r="18"></circle>
          </svg>
          <div class="timer-text">Unlocks in <b id="secText">${WAIT_SECONDS}s</b></div>
        </div>
        <button class="next" id="nextBtn">Continue →</button>
      </div>
    </div>

    <div class="card article-card">
      <div class="divider-label">From the blog</div>
      <div class="article">
        <h3>${article.title}</h3>
        <div class="byline">${article.byline}</div>
        <p>${article.body}</p>
      </div>
    </div>
  `;

  loadAds();
  loadPageWideAds();

  document.getElementById("nextBtn").addEventListener("click", function(){

    const nextPage = Math.min(page + 1, TOTAL_PAGES);
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set('step', String(nextPage));
    window.location.href = nextUrl.toString();
  });

  startCountdown(updateStandardTimerUI);
}

/* =========================================
   FINAL PAGE
========================================= */

function renderFinalPage(){
  col.innerHTML = `
    <div class="card final-card">
      <div class="eyebrow">Step ${TOTAL_PAGES} of ${TOTAL_PAGES}</div>
      <h1>Almost there!</h1>
      <p class="sub">Thanks for your patience.</p>

      <div class="ad-box-small" id="finalAd"></div>

      <button class="get-link-btn" id="getLinkBtn">Get Link</button>

      <div style="margin-top:14px;">
        <div class="timer-wrap" style="justify-content:center;">
          <svg class="ring" viewBox="0 0 42 42">
            <circle class="bg" cx="21" cy="21" r="18"></circle>
            <circle class="fg" id="ringFg" cx="21" cy="21" r="18"></circle>
          </svg>
          <div class="timer-text">Unlocks in <b id="secText">${WAIT_SECONDS}s</b></div>
        </div>
      </div>

      <div class="sponsor-block">
        <div class="lbl">SPONSORED BY</div>
        <span class="sponsor-pill"><span class="dot"></span> show your brand like this </span>
      </div>

      <div id="finalLinkArea"></div>
    </div>

    <div class="card">
      <a class="become-sponsor" href="${TELEGRAM_CONTACT}" target="_blank" rel="noopener">Become a Sponsor!</a>
    </div>
  `;

  loadFinalBanner();
  loadPageWideAds();
  getLinkBtn.addEventListener("click", function(){
    if(secondsLeft > 0 || linkRevealed) return;
    linkRevealed = true;

    document.getElementById("finalLinkArea").innerHTML = `
      <div class="final-link-box">
        <span class="tag2">Official destination</span>
        <div class="link-row">
          <div class="link-field">${OFFICIAL_LINK}</div>
          <button class="copy-btn" id="copyBtn">Copy</button>
        </div>
        <a class="go-link" href="${OFFICIAL_LINK}" target="_blank" rel="noopener">Continue to link →</a>
      </div>
    `;

    const copyBtn = document.getElementById("copyBtn");
    copyBtn.addEventListener("click", function(){
      navigator.clipboard.writeText(OFFICIAL_LINK).then(function(){
        copyBtn.textContent = "Copied";
        setTimeout(function(){ copyBtn.textContent = "Copy"; }, 1400);
      });
    });
  });

  startCountdown(updateFinalTimerUI);
}

/* =========================================
   RENDER / COUNTDOWN / TIMER UI
========================================= */

function renderPage(){
  renderProgress();
  linkRevealed = false;
  if(page === TOTAL_PAGES){
    renderFinalPage();
  } else {
    renderStandardPage();
  }
}

function startCountdown(updateFn){
  clearInterval(timerId);
  secondsLeft = WAIT_SECONDS;
  updateFn();
  timerId = setInterval(function(){
    secondsLeft--;
    updateFn();
    if(secondsLeft <= 0) clearInterval(timerId);
  }, 1000);
}

function baseTimerUpdate(){
  const clamped = Math.max(secondsLeft, 0);
  const secText = document.getElementById("secText");
  const ringFg = document.getElementById("ringFg");
  const segCurrent = document.getElementById("segCurrent");

  if(secText) secText.textContent = clamped > 0 ? clamped + "s" : "ready";

  const progressPct = 1 - (clamped / WAIT_SECONDS);
  if(ringFg) ringFg.style.strokeDashoffset = (113 - 113 * progressPct).toFixed(1);
  if(segCurrent) segCurrent.style.setProperty("--fill", (progressPct * 100).toFixed(0) + "%");

  return clamped;
}

function updateStandardTimerUI(){
  const clamped = baseTimerUpdate();
  const nextBtn = document.getElementById("nextBtn");
  if(clamped <= 0 && nextBtn) nextBtn.classList.add("ready");
}

function updateFinalTimerUI(){
  const clamped = baseTimerUpdate();
  const getLinkBtn = document.getElementById("getLinkBtn");
  if(clamped <= 0 && getLinkBtn) getLinkBtn.classList.add("ready");
}

/* =========================================
   SHARE WITH A FRIEND
   Always points back to step 1, regardless of
   which step the sharer is currently on.
========================================= */

function getShareUrl(){
  const shareUrl = new URL(window.location.href);
  shareUrl.searchParams.set("step", "1");
  return shareUrl.toString();
}

const shareBtn = document.getElementById("shareBtn");
if(shareBtn){
  shareBtn.addEventListener("click", function(){
    const shareUrl = getShareUrl();

    if(navigator.share){
      navigator.share({ title: document.title, url: shareUrl }).catch(function(){});
      return;
    }

    navigator.clipboard.writeText(shareUrl).then(function(){
      const original = shareBtn.textContent;
      shareBtn.textContent = "✅ Link copied";
      shareBtn.classList.add("copied");
      setTimeout(function(){
        shareBtn.textContent = original;
        shareBtn.classList.remove("copied");
      }, 1800);
    });
  });
}

renderPage();

})();
</script>


</body>
</html>
