<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download APK - AFTER MOTION Z</title>

<style>

:root{
  --bg:#eef1f7;
  --card:#ffffff;
  --text:#1a1f36;
  --muted:#6b7280;
  --accent:#3457ff;
  --accent-dark:#2340d9;
  --accent-light:#e8ecff;
  --border:#e5e8f0;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:20px 16px;
}

.container{
  max-width:560px;
  margin:auto;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:35px 24px;
  text-align:center;
  margin-top:10vh;
  box-shadow:0 4px 20px rgba(20,30,70,.08);
}

.icon{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:700;
}

h1{
  margin-top:18px;
  font-size:24px;
}

.meta{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}

.download-section{
  margin-top:25px;
}

.download-btn{
  width:100%;
  padding:17px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#fff;
  font-size:16px;
  font-weight:700;
  opacity:.55;
  cursor:not-allowed;
}

.download-btn.ready{
  opacity:1;
  cursor:pointer;
}

.progress-track{
  height:7px;
  margin-top:16px;
  border-radius:999px;
  background:var(--accent-light);
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--accent);
  transition:width 1s linear;
}

.status{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}


/* ==================================================
   POPUP
================================================== */

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99999;
}

.popup-box{
  position:relative;
  width:100%;
  max-width:340px;
  background:#fff;
  border-radius:16px;
  padding:40px 20px 20px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.popup-close{
  position:absolute;
  top:8px;
  right:10px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#eef1f7;
  color:#333;
  font-size:20px;
  cursor:not-allowed;
  opacity:.45;
}

.popup-close.ready{
  cursor:pointer;
  opacity:1;
}

.popup-label{
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:10px;
}

.popup-timer{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

</style>

</head>

<body>


<!-- ==================================================
     POPUP AD
================================================== -->

<div id="popupAd" class="popup-overlay">

  <div class="popup-box">

    <button
      id="popupClose"
      class="popup-close"
      disabled
      onclick="closePopup()">

      ×

    </button>

    <div class="popup-label">
      Advertisement
    </div>


    <script>
      atOptions = {
        'key' : 'e7f9b2cd6e1e479d9a09f4a5c9ab7ee2',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/e7f9b2cd6e1e479d9a09f4a5c9ab7ee2/invoke.js"></script>


    <div id="popupTimer" class="popup-timer">
      Please wait 30 seconds…
    </div>

  </div>

</div>


<div class="container">


  <div class="card">

    <div class="icon">
      A
    </div>

    <h1>
      AFTER MOTION Z
    </h1>

    <div class="meta">
      Version -10-aug • 90 MB
    </div>


    <div class="download-section">

      <button
        id="downloadBtn"
        class="download-btn"
        disabled>

        Preparing Download (30s)

      </button>


      <div class="progress-track">

        <div
          id="progressFill"
          class="progress-fill">
        </div>

      </div>


      <div
        id="statusText"
        class="status">

        Please wait while your download link is prepared…

      </div>

    </div>

  </div>


</div>


<script>


/* ==================================================
   SETTINGS
================================================== */

const DOWNLOAD_URL =
"https://www.mediafire.com/file/6jebd6yyh2r5kqa/AMZP_ORI_10AUG_FIXED2.apk/file";

const WAIT_SECONDS = 30;


/* ==================================================
   ELEMENTS
================================================== */

const downloadBtn =
document.getElementById("downloadBtn");

const progressFill =
document.getElementById("progressFill");

const statusText =
document.getElementById("statusText");

const popupClose =
document.getElementById("popupClose");

const popupTimer =
document.getElementById("popupTimer");


/* ==================================================
   COUNTDOWN
================================================== */

let secondsLeft =
WAIT_SECONDS;


function updateCountdown(){

  const elapsed =
  WAIT_SECONDS - secondsLeft;

  const percent =
  Math.round(
    (elapsed / WAIT_SECONDS) * 100
  );

  progressFill.style.width =
  percent + "%";


  if(secondsLeft > 0){

    downloadBtn.textContent =
    `Preparing Download (${secondsLeft}s)`;

    statusText.textContent =
    `Please wait ${secondsLeft} second${secondsLeft === 1 ? "" : "s"}…`;

    popupTimer.textContent =
    `Please wait ${secondsLeft} seconds…`;

  }

  else{

    downloadBtn.disabled =
    false;

    downloadBtn.classList.add("ready");

    downloadBtn.textContent =
    "Download APK";

    statusText.textContent =
    "Your download link is ready.";

    popupTimer.textContent =
    "You can now close this advertisement.";

    popupClose.disabled =
    false;

    popupClose.classList.add("ready");

  }

}


updateCountdown();


const timer =
setInterval(() => {

  secondsLeft--;

  if(secondsLeft <= 0){

    secondsLeft = 0;

    clearInterval(timer);

  }

  updateCountdown();

},1000);


/* ==================================================
   CLOSE POPUP
================================================== */

function closePopup(){

  if(secondsLeft > 0){
    return;
  }

  document.getElementById("popupAd").style.display =
  "none";

}


/* ==================================================
   DOWNLOAD
================================================== */

downloadBtn.addEventListener("click",function(){

  if(downloadBtn.disabled){
    return;
  }

  window.location.href =
  DOWNLOAD_URL;

});

</script>

</body>
</html>
