<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Step - Download APK</title>

<style>
:root{
  --bg:#eef1f7;
  --card:#fff;
  --text:#1a1f36;
  --muted:#6b7280;
  --accent:#3457ff;
  --accent-dark:#2340d9;
  --border:#e5e8f0;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:20px 16px;
}

.container{
  max-width:560px;
  margin:auto;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:35px 24px;
  text-align:center;
  margin-top:12vh;
  box-shadow:0 4px 20px rgba(20,30,70,.08);
}

.number{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:#e8ecff;
  color:#3457ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
}

h1{
  margin-top:20px;
  font-size:24px;
}

p{
  color:var(--muted);
  margin-top:8px;
  font-size:14px;
}

.continue{
  display:block;
  margin-top:28px;
  padding:16px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  border-radius:12px;
  font-weight:700;
}

.continue:hover{
  background:var(--accent-dark);
}

.popup-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:99999;
}

.popup-box{
  position:relative;
  width:100%;
  max-width:340px;
  background:#fff;
  border-radius:16px;
  padding:40px 20px 20px;
  text-align:center;
}

.popup-close{
  position:absolute;
  top:8px;
  right:10px;
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#eef1f7;
  font-size:20px;
  cursor:pointer;
}

.popup-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="popupAd" class="popup-overlay">

  <div class="popup-box">

    <button class="popup-close" onclick="closePopup()">×</button>

    <div class="popup-label">Advertisement</div>

    <script>
      atOptions = {
        'key' : 'e7f9b2cd6e1e479d9a09f4a5c9ab7ee2',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/e7f9b2cd6e1e479d9a09f4a5c9ab7ee2/invoke.js"></script>

  </div>

</div>

<div class="container">

  <div class="card">

    <div class="number">4</div>

    <h1>Final Step</h1>

    <p>
      Click below to continue to the download page.
    </p>

    <a href="download.html" class="continue">
      Continue to Download →
    </a>

  </div>

</div>

<script>
function closePopup(){
  document.getElementById("popupAd").style.display="none";
}
</script>

</body>
</html>
